<button
    type="button"
    class="environment-action-button inside-modal-button {{ button_class }}"
    data-loading-text="{{ loading_text }}"
    onclick="sendRequest('{{ request_data }}', '{{ http_method }}', '{{ url }}', '{{ button_type }}', this)"
>
    <span class="action-button-spinner" aria-hidden="true" hidden></span>
    <span class="action-button-label">{{ button_text }}</span>
    <span class="action-button-status sr-only" role="status"></span>
</button>
